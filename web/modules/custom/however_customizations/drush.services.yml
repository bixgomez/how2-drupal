services:
  however_customizations.commands:
    class: Drupal\however_customizations\Drush\Commands\HoweverCustomizationsCommands
    tags:
      - { name: drush.command }

  however_customizations.migration_commands:
    class: Drupal\however_customizations\Drush\Commands\ConsolidationMigrationCommands
    arguments:
      - '@however_customizations.legacy_node_migrator'
      - '@however_customizations.migration_map'
      - '@however_customizations.legacy_link_migrator'
      - '@however_customizations.legacy_text_link_rewriter'
    tags:
      - { name: drush.command }
